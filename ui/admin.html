<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Nortex Travel Claims</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="appbar" id="appbar"></header>
      <main class="content">
      <div class="page">
        <header class="page-head">
          <div>
            <h1>Admin</h1>
            <p>Everyone, every template, every claim, approval and notification. Read-only, except that you build templates here.</p>
          </div>
        </header>

        <div class="tabs" id="tabs" role="tablist" aria-label="Admin sections"></div>

        <section class="panel">
          <div class="panel-head">
            <h2 id="tab-title">Users</h2>
            <a class="btn btn-primary btn-sm" id="create-template" href="flow-builder.html" hidden>
              <i class="ph ph-plus" aria-hidden="true"></i>New flow
            </a>
          </div>
          <div id="tab-content"><div class="panel-pad"><div class="skeleton"></div></div></div>
        </section>
      </div>
      </main>
    </div>
  </div>

  <style>
    /* Admin tables are wide: codes, badges and names stay on one line, and the table scrolls sideways instead of clipping. */
    .table-wrap { overflow-x: auto; }
    .table .mono, .table .badge { white-space: nowrap; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .template-card { border: 1px solid var(--line, #e5e7eb); border-radius: 10px; margin: 16px; overflow: hidden; }
    .template-card h3 { margin: 0; padding: 12px 16px; font-size: 15px; }
    .template-card .table-wrap { border-top: 1px solid var(--line, #e5e7eb); }
  </style>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
